# GitHub Actions — Java platform metrics (bundle, deps, imports, cycles, build time)
name: Platform metrics

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - "feature/**"

permissions:
  contents: read

jobs:
  java-platform-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Maven export
        working-directory: sample-rest-app
        run: |
          chmod +x mvnw
          python3 scripts/export_platform_metrics.py

      - uses: actions/upload-artifact@v4
        with:
          name: java-platform-dependency-report
          path: sample-rest-app/metrics/platform_dependency_report.json
